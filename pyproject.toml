[project]
name = "mastr-power-capacities-germany"
version = "0.1.0"
description = "Research project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # pipeline infrastructure — required by the template itself
    "dvc>=3.55.0",
    "ipykernel>=6.29.0",
    "jupytext>=1.19.0",
    "mystmd>=1.8.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.0",
    # project-specific analysis packages
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "open-mastr>=0.17.1",
    "geopandas>=1.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.32.0",
    "pillow>=10.0.0",
    "shapely>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mpg"]
